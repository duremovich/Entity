name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  plugin-api-boundary:
    # The Apache-2.0 plugin-api/ headers must not pull in GPL core engine
    # headers or platform graphics headers — that boundary is what keeps the
    # linking exception in LICENSE real. Fast, toolchain-free check so a
    # violation fails immediately. See ADR-0005 and plugin-api/CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check plugin-api has no GPL-core or platform includes
        run: |
          set -uo pipefail
          includes=$(grep -rEn '^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"]' plugin-api/ || true)
          # Deny list mirrors plugin-api/CLAUDE.md rules 1-3 plus the Tracy
          # wrapper (entity/profile/ must never leak into the Apache layer).
          # Note: rule 2 permits entity/render/IRenderer.hpp (TextureRef) for
          # hot-path interfaces; nothing uses it yet, so the guard stays
          # strict until something does — carve out the exception then.
          violations=$(echo "$includes" | grep -E 'entt/|d3d12\.h|dxgi|entity/(core|render|timeline|director|renderer|project|ui|systems|profile)/' || true)
          if [ -n "$violations" ]; then
            echo "ERROR: plugin-api/ must not include EnTT, D3D12/DXGI, core engine, or profiling headers:"
            echo "$violations"
            exit 1
          fi
          echo "plugin-api/ license boundary OK."

  windows-build-and-test:
    # Pinned to windows-2022 because the workflow's CMake generator below is
    # "Visual Studio 17 2022". GitHub redirected windows-latest to
    # windows-2025-vs2026 (VS 18 / MSVC 14.50) in May 2026, which has no VS 2022
    # installed — every build started failing at `project()` with "could not
    # find any instance of Visual Studio." Migrating to VS 2026 is a separate
    # work item; pinning here matches the local dev environment.
    runs-on: windows-2022
    timeout-minutes: 90

    # CLAUDE.md mandate: Tracy ON and OFF builds must both compile and pass
    # all ctests. OFF is where rot hides — TracyPlot/TracyLockable/
    # [[maybe_unused]] guards expand to nothing and break silently.
    strategy:
      fail-fast: false
      matrix:
        tracy: [ON, OFF]

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prebuilt FFmpeg (full shared build from gyan.dev). Provides include/,
      # lib/, and bin/ — cmake/FindFFMPEG.cmake reads FFMPEG_ROOT to locate it
      # and the runtime DLLs are copied next to EntityMediaEditor at build time.
      #
      # Why not FedericoCarboni/setup-ffmpeg: that action only caches the bin/
      # directory, dropping the headers and import libs we need. Downloading
      # the gyan.dev archive directly keeps the full install tree.
      - name: Cache FFmpeg shared build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-shared
          key: ffmpeg-shared-${{ runner.os }}-release-full-v1

      - name: Download and extract FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z -UseBasicParsing
          New-Item -ItemType Directory -Force -Path ffmpeg-shared | Out-Null
          7z x ffmpeg.7z "-offmpeg-shared" -y | Out-Null
          Remove-Item ffmpeg.7z

      - name: Export FFMPEG_ROOT
        shell: pwsh
        run: |
          $installed = Get-ChildItem -Path ffmpeg-shared -Directory | Select-Object -First 1
          if (-not $installed) { throw "FFmpeg extraction produced no subdirectory" }
          $root = $installed.FullName
          Write-Host "FFMPEG_ROOT=$root"
          "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Pinned DXC. apps/CMakeLists.txt's find_program otherwise globs the
      # runner image's Windows SDK dxc.exe, which silently changed in the
      # June 2026 image update to a version without -HV 2021 support and
      # broke every shader compile (the June 11+ red builds). A pinned
      # release keeps the shader toolchain deterministic; local dev still
      # uses the SDK via find_program.
      - name: Cache DXC
        id: cache-dxc
        uses: actions/cache@v4
        with:
          path: dxc
          key: dxc-v1.9.2602.24

      - name: Download DXC
        if: steps.cache-dxc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602.24/dxc_2026_05_27.zip"
          Invoke-WebRequest -Uri $url -OutFile dxc.zip -UseBasicParsing
          Expand-Archive dxc.zip -DestinationPath dxc
          Remove-Item dxc.zip

      - name: Export DXC_EXECUTABLE
        shell: pwsh
        run: |
          $dxc = Join-Path $env:GITHUB_WORKSPACE "dxc/bin/x64/dxc.exe"
          if (-not (Test-Path $dxc)) { throw "dxc.exe not found at $dxc" }
          & $dxc --version
          "DXC_EXECUTABLE=$dxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # =====================================================================
      # Caching strategy (two layers):
      #
      # 1. actions/cache for build/vcpkg_installed/ — the fully-built installed
      #    packages, keyed on vcpkg.json content hash. On a cache hit, vcpkg's
      #    manifest check sees everything already present and skips the
      #    from-source compile step for every port.
      #
      # 2. NuGet binary cache at vcpkg's PACKAGE level, stored in GitHub
      #    Packages. Complements layer 1: if vcpkg.json changes so cache-hit
      #    misses, but most individual packages are unchanged, NuGet can still
      #    serve them pre-built and only the changed ones rebuild.
      #
      # Note: FFmpeg is no longer vcpkg-built in CI (the gyan.dev shared build
      # above handles it); these caches cover entt / glfw3 / imgui / gtest /
      # glm / stb only.
      # =====================================================================

      # Cache the vcpkg checkout itself (~200MB clone + bootstrap build).
      # Key includes the baseline commit so upgrading vcpkg invalidates cleanly.
      - name: Cache vcpkg tool
        uses: actions/cache@v4
        id: cache-vcpkg-tool
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-c3867e714dd3a51c272826eea77267876517ed99

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          cd "$VCPKG_ROOT"
          git checkout c3867e714dd3a51c272826eea77267876517ed99
          ./bootstrap-vcpkg.bat

      # Cache the installed packages. This is the big win.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      # NuGet binary cache as a secondary layer. Handles the case where
      # vcpkg.json changes (cache miss on layer 1) but most packages are still
      # cached by GitHub Packages at the individual-port level.
      - name: Configure vcpkg NuGet binary cache
        shell: pwsh
        run: |
          $nugetUrl = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          & "$env:VCPKG_ROOT/vcpkg.exe" fetch nuget | Out-Null
          $nuget = (& "$env:VCPKG_ROOT/vcpkg.exe" fetch nuget) | Select-Object -Last 1
          & $nuget sources add -Source $nugetUrl -StorePasswordInClearText -Name GitHubPackages `
            -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" 2>&1 | Out-Null
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source $nugetUrl 2>&1 | Out-Null
          echo "VCPKG_BINARY_SOURCES=clear;nuget,$nugetUrl,readwrite" >> $env:GITHUB_ENV

      # Configure CMake — vcpkg install happens here during manifest resolution.
      # Retry loop kept as a cheap safety net for transient GitHub download
      # hiccups on other ports; FFmpeg no longer runs through here.
      - name: Configure CMake (with retry)
        shell: bash
        run: |
          # VCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON skips the `ffmpeg` feature
          # in vcpkg.json; FFmpeg comes from the prebuilt gyan.dev download
          # (see FFMPEG_ROOT env + cmake/FindFFMPEG.cmake).
          for attempt in 1 2 3; do
            echo "=== cmake configure attempt $attempt/3 ==="
            if cmake -B build -S . \
                -G "Visual Studio 17 2022" \
                -A x64 \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
                -DENTITY_ENABLE_TRACY=${{ matrix.tracy }} \
                -DDXC_EXECUTABLE="$DXC_EXECUTABLE"; then
              echo "=== cmake configure succeeded on attempt $attempt ==="
              exit 0
            fi
            echo "=== cmake configure failed on attempt $attempt ==="
            if [ $attempt -lt 3 ]; then
              echo "Sleeping 20s before retry..."
              sleep 20
            fi
          done
          echo "=== cmake configure failed after 3 attempts ==="
          exit 1

      - name: Build (Release)
        shell: bash
        run: cmake --build build --config Release -j

      - name: Run all tests (unit + integration)
        shell: bash
        working-directory: build
        # ENTITY_FORCE_WARP locks D3D12 to the software rasterizer for
        # cross-machine determinism on golden-hash integration tests. CI runners
        # have no GPU and would default to WARP anyway; setting it explicitly
        # makes local repros (`ENTITY_FORCE_WARP=1 ctest ...`) match.
        env:
          ENTITY_FORCE_WARP: 1
        run: ctest -C Release --output-on-failure

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-tracy-${{ matrix.tracy }}
          path: |
            test_output/
            build/Testing/
          retention-days: 7
