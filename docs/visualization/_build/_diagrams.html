<!-- D3: Snapshot-bake decision tree                                      -->
<!-- Section: S2   Complexity: small                                      -->

<svg font-family="inherit" data-diagram="D3" viewBox="0 0 920 320" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">Snapshot-bake decision tree for editor-tick systems</title>
  <desc id="d3-desc">Decision tree: root asks whether system drives output. If yes, asks whether it writes registry. Registry-writes branch leads to snapshot-bake leaves (AnimationSystem, SectionScheduler, TextSystem). Non-registry-write branch leads to show-fallback-tick leaves (Timeline, DecodeSystem, AudioSystem).</desc>
  <defs>
    <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52525B"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="310" y="12" width="300" height="44" rx="4" fill="#F1EFE9" stroke="#1B1B1F" stroke-width="1.5"/>
  <text x="460" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1B1F">Editor-tick system</text>
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#52525B">drives projector output?</text>
  <line x1="460" y1="56" x2="460" y2="88" stroke="#52525B" stroke-width="1.5" marker-end="url(#d3-arrow)"/>

  <!-- Second node -->
  <rect x="310" y="88" width="300" height="44" rx="4" fill="#F1EFE9" stroke="#1B1B1F" stroke-width="1.5"/>
  <text x="460" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1B1F">Writes registry</text>
  <text x="460" y="124" text-anchor="middle" font-size="11" fill="#52525B">components each tick?</text>

  <!-- YES branch (left -> snapshot-bake) -->
  <line x1="360" y1="110" x2="220" y2="110" stroke="#52525B" stroke-width="1.5"/>
  <line x1="220" y1="110" x2="220" y2="170" stroke="#52525B" stroke-width="1.5" marker-end="url(#d3-arrow)"/>
  <text x="290" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">YES</text>

  <!-- NO branch (right -> show-fallback) -->
  <line x1="560" y1="110" x2="700" y2="110" stroke="#52525B" stroke-width="1.5"/>
  <line x1="700" y1="110" x2="700" y2="170" stroke="#52525B" stroke-width="1.5" marker-end="url(#d3-arrow)"/>
  <text x="630" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#0891B2">NO</text>

  <text x="220" y="208" text-anchor="middle" font-size="10" fill="#7C3AED">Bake result into ClipCatalogEntry;</text>

  <text x="700" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#0891B2">Show-fallback tick</text>
  <text x="700" y="208" text-anchor="middle" font-size="10" fill="#0891B2">Show thread calls system directly</text>

  <!-- Snapshot-bake leaves -->
  <line x1="220" y1="214" x2="220" y2="248" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#d3-arrow)"/>

  <rect x="60" y="248" width="160" height="36" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="140" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">AnimationSystem</text>
  <text x="140" y="278" text-anchor="middle" font-size="10" fill="#52525B">tracks -&gt; ClipCatalogEntry</text>

  <rect x="230" y="248" width="150" height="36" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="305" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">SectionScheduler</text>
  <text x="305" y="278" text-anchor="middle" font-size="10" fill="#52525B">anchor -&gt; CatalogEntry</text>

  <!-- Show-fallback leaves -->

  <rect x="560" y="248" width="120" height="36" rx="3" fill="#FFFFFF" stroke="#0891B2" stroke-width="1"/>

  <text x="864" y="278" text-anchor="middle" font-size="10" fill="#52525B">atomic workers</text>

<svg font-family="inherit" data-diagram="D11" viewBox="0 0 920 300" preserveAspectRatio="xMidYMid meet"

  <title id="d11-title">Plugin transport tiers: control-plane vs hot-path</title>
  <desc id="d11-desc">Two horizontal lanes. Top lane: Control-Plane plugins (osc-receiver, osc-sender, bus-logger, dmx-artnet) communicate via CommandDispatcher enqueue and OutboundBridge. Bottom lane: Hot-Path plugins use OutputDriver and CodecProvider C++ ABIs with static linkage only. Note: no public hot-path plugins exist today.</desc>

  <rect x="4" y="4" width="912" height="132" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="20" y="26" font-size="12" font-weight="700" fill="#15803D">CONTROL-PLANE TIER (ADR-0013 / ADR-0023)</text>
  <text x="20" y="42" font-size="10" fill="#52525B">Network-serializable data path. Plugins call IPluginContext::enqueueCommand() or OutboundBridge::emit().</text>
  <text x="20" y="56" font-size="10" fill="#52525B">Bus stays Director-to-Renderer only. Future: static -&gt; dynamic plugin upgrade is purely additive.</text>

  <!-- Plugin boxes -->
  <rect x="20" y="64" width="140" height="56" rx="3" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>

  <text x="90" y="104" text-anchor="middle" font-size="9" fill="#52525B">Inbound OSC/UDP</text>
  <text x="90" y="116" text-anchor="middle" font-size="9" fill="#52525B">-&gt; Director cmds</text>

  <text x="240" y="116" text-anchor="middle" font-size="9" fill="#52525B">30 Hz transport bcast</text>

  <rect x="320" y="64" width="140" height="56" rx="3" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
  <text x="390" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#15803D">dmx-artnet</text>

  <text x="772" y="104" text-anchor="middle" font-size="9" fill="#52525B" font-style="italic">folded in via -DEXTRA_PLUGIN_DIRS</text>
  <text x="772" y="116" text-anchor="middle" font-size="9" fill="#52525B" font-style="italic">Apache 2.0 plugin-api boundary respected</text>

  <!-- Lane 2: Hot-path -->
  <rect x="4" y="152" width="912" height="132" rx="4" fill="#E5E5E5" stroke="#525252" stroke-width="2"/>

  <text x="20" y="190" font-size="10" fill="#52525B">C++ ABI: OutputDriver / CodecProvider. Static-link only. Toolchain-locked. Per-frame GPU data path.</text>
  <text x="20" y="206" font-size="10" fill="#52525B">No entt.hpp, no d3d12.h, no engine internals in plugin-api/ headers (CI-enforced).</text>
